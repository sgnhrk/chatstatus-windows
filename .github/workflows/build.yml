name: Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./Build.ps1
      - name: Test
        shell: pwsh
        run: |
          $test = Start-Process ./dist/ChatStatus.exe -ArgumentList '--test' -PassThru
          if (-not $test.WaitForExit(60000)) { throw 'Tests timed out' }
          if ($test.ExitCode -ne 0) { throw 'Tests failed' }
          Get-Content ./dist/test-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChatStatus-windows
          path: |
            dist/ChatStatus.exe
            dist/README.md
            dist/LICENSE
